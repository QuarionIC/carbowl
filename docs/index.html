<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Carbowl">
<meta name="description" content="Hands-free quizbowl practice: questions from QBReader read aloud, answered by voice.">
<title>Carbowl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231E6E6A'/%3E%3Ccircle cx='90' cy='98' r='44' fill='%23fff'/%3E%3Crect x='70' y='34' width='40' height='26' rx='8' fill='%23fff'/%3E%3Ccircle cx='90' cy='98' r='26' fill='%231E6E6A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-phase="boot" data-state="idle">
  <header class="top">
    <h1>Carbowl</h1>
    <div class="score" id="score" aria-label="Score"></div>
    <button class="icon" id="openReview" aria-label="Review this session" title="Review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg></button>
    <button class="icon" id="openSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.600 7.600 0 0 0-1.700 1l-2.400-1-2 3.400L6.600 11a7.500 7.500 0 0 0 0 2l-2 1.600 2 3.400 2.400-1c.5.400 1.100.700 1.700 1l.4 2.500h4l.4-2.500c.6-.300 1.200-.600 1.700-1l2.400 1 2-3.400zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg></button>
  </header>

  <main class="stage" id="stage">
    <p class="meta" id="meta"></p>
    <p class="status" id="status" role="status" aria-live="polite">Loading…</p>
    <div class="progress" id="progress" hidden><i id="progressFill"></i><b id="powerMark" hidden title="Power mark"></b></div>
    <div class="qtext" id="qtext"></div>
    <div class="answer" id="answer" hidden></div>
    <p class="heard" id="heard"></p>

    <section class="setup" id="setup" hidden>
      <h2 id="setupTitle">Speech models</h2>
      <p id="setupText"></p>
      <div class="bar" id="setupBar" hidden><i id="setupFill"></i></div>
      <p class="fine" id="setupFine"></p>
      <button class="btn primary" id="setupBtn">Download</button>
    </section>
  </main>

  <div class="mic" id="mic" aria-hidden="true">
    <span class="dot" id="micDot"></span>
    <div class="meter"><i id="meterFill"></i></div>
    <span class="miclabel" id="micLabel">Microphone off</span>
  </div>

  <footer class="controls">
    <div class="row" id="secondary">
      <button class="btn" id="btnPause">Pause</button>
      <button class="btn" id="btnSkip">Skip</button>
      <button class="btn" id="btnRight" hidden>I was right</button>
      <button class="btn" id="btnWrong" hidden>I was wrong</button>
      <button class="btn quiet" id="btnStop">End</button>
    </div>
    <button class="big" id="btnMain" disabled>Start</button>
  </footer>
</div>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <form method="dialog" class="sheet-in" id="settingsForm">
    <header class="sheet-top">
      <h2 id="settingsTitle">Settings</h2>
      <button class="btn primary" id="closeSettings" value="close">Done</button>
    </header>
    <div class="sheet-body" id="settingsBody"></div>
  </form>
</dialog>

<dialog class="sheet" id="review" aria-labelledby="reviewTitle">
  <form method="dialog" class="sheet-in">
    <header class="sheet-top">
      <h2 id="reviewTitle">This session</h2>
      <button class="btn primary" value="close">Done</button>
    </header>
    <div class="sheet-body" id="reviewBody"></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
